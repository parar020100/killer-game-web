# Шаблон обратного прокси nginx для «Киллер / Папарацци».
# Замените __DOMAIN__ на свой домен (это делает deploy/setup-service.sh) и положите
# файл в /etc/nginx/sites-available/__DOMAIN__, затем включите симлинком в
# sites-enabled. HTTPS (listen 443, сертификаты, редирект 80→443) добавит certbot.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # Загрузка фото-пруфов может быть крупной — поднимаем лимит тела запроса.
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
