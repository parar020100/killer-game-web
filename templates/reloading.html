<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Киллер / Папарацци — перезапуск</title>
<style>
  :root {
    --bg: #eaeef4; --surface: #ffffff; --text: #171a21; --text-dim: #6a7280;
    --border: #e2e7ef; --accent: #e23b4e;
    --shadow: 0 6px 24px rgba(23,26,40,.10);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1116; --surface: #191d24; --text: #e9ecf1; --text-dim: #9aa4b2;
      --border: #2a313b; --accent: #ff5069; --shadow: 0 8px 30px rgba(0,0,0,.45);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial,
                 "Apple Color Emoji", "Segoe UI Emoji", sans-serif;
    line-height: 1.5; min-height: 100dvh; display: flex; align-items: center; justify-content: center;
    padding: 20px 14px calc(20px + env(safe-area-inset-bottom));
  }
  .card {
    width: 100%; max-width: 420px; background: var(--surface);
    border: 1px solid var(--border); border-radius: 20px; box-shadow: var(--shadow);
    padding: 30px 24px; text-align: center;
  }
  .spin {
    width: 46px; height: 46px; margin: 0 auto 18px; border-radius: 50%;
    border: 4px solid var(--border); border-top-color: var(--accent);
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 { margin: 0 0 8px; font-size: 19px; }
  p { margin: 0; font-size: 14.5px; color: var(--text-dim); }
  .count { color: var(--accent); font-weight: 700; }
  .manual { margin-top: 16px; font-size: 13px; }
  .manual a { color: var(--accent); }
</style>
</head>
<body>
  <main class="card">
    <div class="spin"></div>
    <h1>{{ title_msg }}</h1>
    <p>{{ sub_msg }} Переход на страницу входа через
       <span class="count" id="cnt">{{ seconds }}</span>&nbsp;с…</p>
    <p class="manual">Если ничего не произошло —
       <a href="{{ target }}">войти сейчас</a>.</p>
  </main>
  <script>
    (function () {
      var n = {{ seconds }};
      var el = document.getElementById('cnt');
      var timer = setInterval(function () {
        n -= 1;
        if (el) el.textContent = n < 0 ? 0 : n;
        if (n <= 0) { clearInterval(timer); window.location.replace({{ target | tojson }}); }
      }, 1000);
    })();
  </script>
</body>
</html>
