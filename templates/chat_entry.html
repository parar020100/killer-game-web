<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Киллер / Папарацци — бот</title>
<style>
  :root {
    --bg: #eaeef4; --surface: #ffffff; --btn-bg: #f4f6fa; --btn-bg-hover: #eaeef4;
    --text: #171a21; --text-dim: #6a7280; --border: #e2e7ef;
    --accent: #e23b4e; --accent-soft: rgba(226,59,78,.10); --accent-border: rgba(226,59,78,.28);
    --shadow: 0 6px 24px rgba(23,26,40,.10); --shadow-sm: 0 2px 6px rgba(23,26,40,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1116; --surface: #191d24; --btn-bg: #222831; --btn-bg-hover: #2a313b;
      --text: #e9ecf1; --text-dim: #9aa4b2; --border: #2a313b;
      --accent: #ff5069; --accent-soft: rgba(255,80,105,.14); --accent-border: rgba(255,80,105,.35);
      --shadow: 0 8px 30px rgba(0,0,0,.45); --shadow-sm: 0 2px 8px rgba(0,0,0,.35);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial,
                 "Apple Color Emoji", "Segoe UI Emoji", sans-serif;
    line-height: 1.5; min-height: 100dvh; display: flex; align-items: center; justify-content: center;
    padding: 20px 14px calc(20px + env(safe-area-inset-bottom));
  }
  .card {
    width: 100%; max-width: 420px; background: var(--surface);
    border: 1px solid var(--border); border-radius: 20px; box-shadow: var(--shadow);
    padding: 26px 22px; display: flex; flex-direction: column; gap: 16px;
  }
  .head { display: flex; align-items: center; gap: 12px; }
  .logo {
    width: 46px; height: 46px; flex: 0 0 46px; border-radius: 14px;
    display: grid; place-items: center; font-size: 24px;
    background: linear-gradient(135deg, var(--accent), #8a1f2b); box-shadow: var(--shadow-sm);
  }
  .head .name { font-weight: 700; font-size: 17px; }
  .head .sub { font-size: 13px; color: var(--text-dim); }
  p.lead { margin: 0; font-size: 14.5px; color: var(--text-dim); }
  form { display: flex; gap: 8px; }
  input[type=text] {
    flex: 1; min-width: 0; font: inherit; font-size: 15px; padding: 12px 14px;
    border: 1px solid var(--border); border-radius: 12px; background: var(--btn-bg); color: var(--text);
  }
  input[type=text]:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  button {
    appearance: none; border: 1px solid var(--accent-border); background: var(--accent-soft);
    color: var(--accent); font: inherit; font-weight: 650; font-size: 15px;
    padding: 12px 18px; border-radius: 12px; cursor: pointer;
  }
  button:hover { filter: brightness(1.05); }
  .foot { font-size: 12px; color: var(--text-dim); text-align: center; }
</style>
</head>
<body>
  <main class="card">
    <div class="head">
      <div class="logo">🕵️</div>
      <div>
        <div class="name">Киллер · Папарацци</div>
        <div class="sub">бот игры (эмуляция)</div>
      </div>
    </div>
    <p class="lead">Введите ваш <b>id</b> (имя пользователя), чтобы открыть чат с ботом.
      Если такого пользователя нет — он будет создан.</p>
    <form action="/chat" method="get">
      <input type="text" name="id" placeholder="например, parar020100" autofocus
             autocomplete="off" autocapitalize="off" spellcheck="false">
      <button type="submit">ОК</button>
    </form>
    <p class="foot">В настоящей версии этот чат заменят боты Telegram и VK.</p>
  </main>
</body>
</html>
