<script>
// Живой поиск по списку игроков: подсвечивает совпадения оранжевым. По мере ввода
// перескакивает к первому; Enter (и стрелки ‹/›) листают совпадения по кругу
// (Shift+Enter — назад). Клик по метке «кем пойман» (data-jump) ищет того игрока.
// Делегирование на document, поэтому переживает живое обновление списка.
(function () {
  var idx = -1;  // индекс текущего совпадения среди .ucard.match

  function input() { return document.getElementById('usearch'); }
  function matches() {
    return Array.prototype.slice.call(document.querySelectorAll('.ucard.match'));
  }

  function apply(scroll) {
    var inp = input();
    if (!inp) return;
    var q = (inp.value || '').trim().toLowerCase();
    var count = 0;
    document.querySelectorAll('.ucard').forEach(function (c) {
      var hay = c.getAttribute('data-search') || '';
      var hit = q !== '' && hay.indexOf(q) !== -1;
      c.classList.toggle('match', hit);
      if (hit) count++;
    });
    var empty = document.querySelector('.usearch-empty');
    if (empty) empty.hidden = !(q !== '' && count === 0);
    idx = count ? 0 : -1;
    highlight(scroll);
  }

  function highlight(scroll) {
    var ms = matches();
    ms.forEach(function (c, i) { c.classList.toggle('match-current', i === idx); });
    // прокрутка к текущему совпадению (по возможности внутри окна списка)
    if (scroll && idx >= 0 && ms[idx]) {
      ms[idx].scrollIntoView({ block: 'center', behavior: 'smooth' });
    }
  }

  function step(delta) {
    var ms = matches();
    if (!ms.length) return;
    idx = (idx + delta + ms.length) % ms.length;
    highlight(true);
  }

  document.addEventListener('input', function (e) {
    if (e.target && e.target.id === 'usearch') apply(true);
  });

  document.addEventListener('keydown', function (e) {
    if (e.target && e.target.id === 'usearch' && e.key === 'Enter') {
      e.preventDefault();
      step(e.shiftKey ? -1 : 1);
    }
  });

  document.addEventListener('click', function (e) {
    var nav = e.target.closest('#usearch-next, #usearch-prev');
    if (nav) { e.preventDefault(); step(nav.id === 'usearch-next' ? 1 : -1); return; }
    // клик по метке «кем пойман» — подставить имя в поиск, найти игрока в списке
    // и раскрыть его карточку (замена перехода на отдельную страницу игрока)
    var jump = e.target.closest('[data-jump]');
    if (jump) {
      e.preventDefault();
      e.stopPropagation();
      var inp = input();
      if (inp) {
        inp.value = jump.getAttribute('data-jump');
        apply(true);
        var m = document.querySelector('.ucard.match');
        if (m) m.open = true;   // раскрыть меню найденного игрока
        inp.focus();
      }
    }
  });
})();
</script>
