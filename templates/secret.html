<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Секрет · Киллер / Папарацци</title>
<style>
  :root {
    --bg: #eaeef4; --surface: #ffffff; --text: #171a21; --text-dim: #6a7280; --border: #e2e7ef;
    --accent: #e23b4e;
    --yt: #ff0033; --yt-soft: rgba(255,0,51,.10); --yt-border: rgba(255,0,51,.4);
    --rt: #00a8ff; --rt-soft: rgba(0,168,255,.10); --rt-border: rgba(0,168,255,.4);
    --shadow: 0 6px 24px rgba(23,26,40,.10);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1116; --surface: #191d24; --text: #e9ecf1; --text-dim: #9aa4b2; --border: #2a313b;
      --accent: #ff5069;
      --yt-soft: rgba(255,0,51,.16); --rt-soft: rgba(0,168,255,.16);
      --shadow: 0 8px 30px rgba(0,0,0,.45);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial,
                 "Apple Color Emoji", "Segoe UI Emoji", sans-serif;
    line-height: 1.5; min-height: 100dvh; display: flex; justify-content: center; align-items: flex-start;
    padding: 20px 14px calc(20px + env(safe-area-inset-bottom));
  }
  .app { width: 100%; max-width: 460px; display: flex; flex-direction: column; gap: 16px; }
  .head { display: flex; align-items: center; gap: 10px; }
  .head h1 { margin: 0; font-size: 18px; }
  .head .back { margin-left: auto; text-decoration: none; color: var(--accent); font-weight: 600; font-size: 13px; }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 18px;
    box-shadow: var(--shadow); padding: 22px 18px; display: flex; flex-direction: column; gap: 14px;
    text-align: center;
  }
  .card p { margin: 0; color: var(--text-dim); font-size: 14.5px; }
  .choices { display: flex; flex-direction: column; gap: 10px; }
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 9px;
    text-decoration: none; font-weight: 700; font-size: 16px; padding: 15px;
    border-radius: 14px; border: 1px solid var(--border); color: var(--text);
  }
  .btn.yt { background: var(--yt-soft); border-color: var(--yt-border); color: var(--yt); }
  .btn.rt { background: var(--rt-soft); border-color: var(--rt-border); color: var(--rt); }
</style>
</head>
<body>
  <main class="app">
    <div class="head">
      <h1>🤫 Секрет</h1>
      <a class="back" href="{{ link('/app') }}">← в меню</a>
    </div>

    <div class="card">
      <div style="font-size:42px">🎁</div>
      <p>Вы почти у цели! Осталось выбрать любимую видеоплощадку —
         и секрет откроется.</p>
      <div class="choices">
        <a class="btn rt" href="{{ rutube }}" target="_blank" rel="noopener">🅡 Смотреть на RuTube</a>
        <a class="btn yt" href="{{ youtube }}" target="_blank" rel="noopener">▶️ Смотреть на YouTube</a>
      </div>
    </div>
  </main>
</body>
</html>
